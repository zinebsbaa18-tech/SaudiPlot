[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saudi-plot-design"
version = "0.1.0"
description = "Saudi Plot Design Studio - one rectangular plot to a Saudi-character concept sheet (PDF + DXF)"
requires-python = ">=3.11"
# Locked stack (ARCHITECTURE.md par.2).
dependencies = [
    "shapely>=2.0",
    "pydantic>=2.0",
    "ezdxf>=1.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pypdf>=4",  # test-only: PDF reopen/smoke validation (M5)
    "ifcopenshell>=0.8",  # M6A tests skip without it; dev must run them
]
# M6A case ingestion only - the locked MVP core does not depend on this.
cases = [
    "ifcopenshell>=0.8",
]
# W1 web adapter (src/saudi_plot_api) only - the deterministic offline core
# (saudi_plot_design) does not depend on any of this (ADR-WEB-001).
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.41",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.18",
    "httpx>=0.27",  # API tests use fastapi.testclient which requires httpx
    # Plan-SVG rasterization for presentation renders (providers take raster
    # input only). cairosvg converts SVG→PNG directly via cairocffi (no
    # system pkg-config lookup required at install time).
    "cairosvg>=2.7",
]

[project.scripts]
spd = "saudi_plot_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic assets ship with the wheel so installed [web] deployments can run
# migrations via `python -m saudi_plot_api.migrate` (no alembic.ini needed).
saudi_plot_api = [
    "migrations/env.py",
    "migrations/script.py.mako",
    "migrations/versions/*.py",
]
saudi_plot_design = [
    "data/demo/*.json",
    "data/demo/*.geojson",
    "data/demo/architectural_character_zones/*.json",
    "data/demo/architectural_character_zones/*.geojson",
    "data/demo/styles/*/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
