# Alembic configuration for the web adapter (src/saudi_plot_api).
# The URL below is the local-development default; SPD_DATABASE_URL overrides it
# (see src/saudi_plot_api/migrations/env.py). No secrets belong in this file.

[alembic]
script_location = src/saudi_plot_api/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///./var/saudi_plot_api.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
