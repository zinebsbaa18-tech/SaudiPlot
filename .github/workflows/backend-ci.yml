name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # The knowledge databases (Git LFS) are not needed for the backend
          # suite: geo tests build their own fixture databases.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend (dev + web extras)
        run: python -m pip install -e ".[dev,web]"

      - name: Run migrations against a temporary database
        env:
          SPD_ENVIRONMENT: test
          SPD_DATABASE_URL: sqlite:///${{ runner.temp }}/ci_migrations.db
        run: python -m saudi_plot_api.migrate

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest
