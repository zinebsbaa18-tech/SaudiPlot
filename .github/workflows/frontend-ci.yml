name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/check-lint-baseline.mjs"
      - "scripts/frontend-lint-baseline.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/check-lint-baseline.mjs"
      - "scripts/frontend-lint-baseline.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Lint (against approved frozen baseline)
        # The frozen accepted UI carries 13 known lint errors that must not be
        # "fixed" by modifying frozen files. The baseline check accepts exactly
        # those and fails on any new error.
        run: |
          npx eslint . -f json -o "$RUNNER_TEMP/eslint-report.json" || true
          node ../scripts/check-lint-baseline.mjs "$RUNNER_TEMP/eslint-report.json" ../scripts/frontend-lint-baseline.json
